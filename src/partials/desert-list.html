<section class="desert-list" id="desert-list">
  <div class="container dessert-list-container">
    <div class="desert-list-header">
      <div class="desert-list-heading">
        <h2 class="heading-2 desert-list-title">Солодощі</h2>
        <p class="desert-list-subtitle">
          Спробуйте наші смачні десерти, які вас здивують!
        </p>
      </div>
      <select
        class="desert-categories-select"
        aria-label="Категорії десертів"
      ></select>
    </div>
    <ul class="desert-categories" aria-label="Категорії десертів"></ul>
    <div class="list-style-selector">
      <div class="list-style-button grid4x2 isChoice">
        <svg width="24" height="24">
          <use href="./img/grid.svg#icon-grid-4x2"></use>
        </svg>
      </div>
      <div class="list-style-button grid5x3">
        <svg width="24" height="24">
          <use href="./img/grid.svg#icon-grid-5x3"></use>
        </svg>
      </div>
    </div>
    <ul class="desert-cards"></ul>
    <p class="desert-empty" hidden>Десертів у цій категорії поки немає.</p>
    <button class="desert-load-more" type="button" hidden>
      Завантажити ще
    </button>
  </div>
</section>
