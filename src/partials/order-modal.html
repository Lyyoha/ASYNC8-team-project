<div class="backdrop order-backdrop" data-order-backdrop>
  <div class="order-modal" data-order-modal>
    <!-- CLOSE -->
    <button class="order-close-btn" data-order-close>
      <svg width="20" height="20">
        <use href="./img/sprite.svg#close"></use>
      </svg>
    </button>

    <h2 class="order-title">Оформлення замовлення</h2>

    <form class="order-form" data-order-form>
      <!-- NAME -->
      <div class="order-field">
        <input
          type="text"
          name="name"
          class="floating-input"
          placeholder=" "
          autocomplete="name"
        />
        <label class="floating-label">Ім'я</label>
      </div>

      <!-- PHONE -->
      <div class="order-field">
        <input
          type="tel"
          name="phone"
          class="floating-input"
          placeholder=" "
          autocomplete="tel"
        />
        <label class="floating-label">Телефон</label>
      </div>

      <!-- COMMENT -->
      <div class="order-field">
        <textarea
          name="comment"
          class="floating-textarea"
          placeholder=" "
        ></textarea>
        <label class="floating-label">Коментар</label>
      </div>

      <!-- HIDDEN dessertId -->
      <input type="hidden" name="dessertId" />

      <button type="submit" class="order-submit-btn">Надіслати заявку</button>
    </form>
  </div>
</div>
