<div class="backdrop product-backdrop" data-product-backdrop>
  <div class="product-modal" data-product-modal>
    <!-- CLOSE BUTTON -->
    <button class="product-close-btn" data-product-close>
      <svg width="20" height="20">
        <use href="/img/sprite.svg#close"></use>
      </svg>
    </button>

    <div class="product-modal-inner">
      <!-- IMAGE -->
      <div class="product-img-wrapper">
        <img
          src="src/img/hero/hero-desktop.jpg"
          alt="dessert"
          class="product-img"
        />
      </div>

      <!-- CONTENT -->
      <div class="product-content">
        <!-- TITLE -->
        <h2 class="product-title"></h2>

        <!-- PRICE -->
        <p class="product-price"></p>

        <!-- RATING -->
        <div class="product-rating"></div>

        <!-- DESCRIPTION -->
        <p class="product-desc"></p>

        <!-- COMPOSITION -->
        <p class="product-composition">
          <span class="composition-label">Склад:</span>
          <span class="composition-value"></span>
        </p>

        <!-- ORDER BUTTON WRAPPER -->
        <div class="order-btn-wrapper">
          <button class="order-btn" data-order-open data-dessert-id="">
            Перейти до замовлення
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
